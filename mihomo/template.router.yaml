# =========================================================
# OpenClash / Mihomo - Router
# =========================================================

mixed-port: 7890
mode: rule

allow-lan: true
bind-address: "*"

ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info

profile:
  store-selected: true
  store-fake-ip: true

# ---------------------------------------------------------
# TCP Keep Alive
# ---------------------------------------------------------

disable-keep-alive: false
keep-alive-idle: 300
keep-alive-interval: 30

# =========================================================
# GEO Data
# =========================================================

geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 48

geox-url:
  geoip: https://gcore.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  geosite: https://gcore.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
  mmdb: https://gcore.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb
  asn: https://gcore.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb

# =========================================================
# TUN
# =========================================================

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  endpoint-independent-nat: false
  disable-icmp-forwarding: true # https://linux.do/t/topic/1460117#p-12575152-icmp-3
  dns-hijack: [any:53, "tcp://any:53"]

# =========================================================
# Sniffer
# =========================================================

sniffer:
  enable: true
  sniff:
    TLS: {ports: [443], override-destination: true}
    HTTP: {ports: [80, 8080-8880], override-destination: true}
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true

# =========================================================
# DNS
# =========================================================

dns:
  enable: true
  ipv6: false

  cache-algorithm: arc
  prefer-h3: false

  # Fake-IP
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  fake-ip-filter:
    # NTP / 时间同步
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    - 'time.*.com'
    - 'time.*.gov'

    # 局域网
    - '*.lan'
    - '*.local'

    # STUN / P2P / 游戏
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    - '*.n.n.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'

    # 国内 / Private / Apple / Microsoft
    - 'geosite:cn,private,apple,microsoft'

  # -------------------------------------------------------
  # DNS Server bootstrap
  # -------------------------------------------------------

  # 用于解析 DNS 服务器域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver-policy:
    'geosite:cn,private,apple,microsoft':
      - 223.5.5.5
      - 119.29.29.29
    'geosite:gfw':
      - 8.8.8.8
      - 1.1.1.1

  # 默认 DNS
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

  # 专门用于解析代理节点服务器域名
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# =========================================================
# Proxies
# =========================================================

proxies:

# =========================================================
# Proxy Groups
# =========================================================

anchors:
  base: &proxy_base
    - 选择代理
    - 香港节点
    - 台湾节点
    - 新加坡节点
    - 日本节点
    - 美国节点
    - 手动选择
    - DIRECT

proxy-groups:

  # -------------------------------------------------------
  # 主代理
  # -------------------------------------------------------

  - name: 选择代理
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies:
      - 故障转移
      - 香港节点
      - 台湾节点
      - 新加坡节点
      - 日本节点
      - 美国节点
      - 手动选择
      - DIRECT

  # -------------------------------------------------------
  # 手动节点
  # -------------------------------------------------------

  - name: 手动选择
    icon: https://gcore.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png
    type: select
    include-all: true

  # -------------------------------------------------------
  # 自动故障转移
  # -------------------------------------------------------

  - name: 故障转移
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bypass.png
    type: fallback

    url: https://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    max-failed-times: 3
    lazy: true

    proxies:
      - 香港节点
      - 台湾节点
      - 新加坡节点
      - 日本节点
      - 美国节点

  # -------------------------------------------------------
  # 功能组
  # -------------------------------------------------------

  - name: 大富翁游戏
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Puzzle.png
    type: select
    proxies: *proxy_base

  - name: AI
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
    type: select
    proxies: *proxy_base

  - name: Developer
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png
    type: select
    proxies: *proxy_base

  - name: Microsoft
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png
    type: select
    proxies: *proxy_base

  - name: Google
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
    type: select
    proxies: *proxy_base

  - name: Netflix
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Netflix.png
    type: select
    proxies: *proxy_base

  - name: TikTok
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png
    type: select
    proxies: *proxy_base

  - name: Spotify
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png
    type: select
    proxies: *proxy_base

  - name: Telegram
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
    type: select
    proxies: *proxy_base

  - name: Social Media
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png
    type: select
    proxies: *proxy_base

  - name: Game
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    proxies: *proxy_base

  # =======================================================
  # 地区节点
  # =======================================================

  - name: 香港节点
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
    type: url-test

    include-all: true

    filter: '(?i)香港|港|HK|Hong Kong|HongKong|hongkong|🇭🇰'
    exclude-filter: '0\.[0-5]|低倍率|省流|大流量|实验性'

    url: https://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    tolerance: 20
    lazy: true

  - name: 台湾节点
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png
    type: url-test

    include-all: true

    filter: '(?i)台湾|台|新北|彰化|TW|Taiwan|🇹🇼'
    exclude-filter: '0\.[0-5]|低倍率|省流|大流量|实验性'

    url: https://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    tolerance: 20
    lazy: true

  - name: 新加坡节点
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png
    type: url-test

    include-all: true

    filter: '(?i)新加坡|坡|狮城|SG|Singapore|🇸🇬'
    exclude-filter: '0\.[0-5]|低倍率|省流|大流量|实验性'

    url: https://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    tolerance: 20
    lazy: true

  - name: 日本节点
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png
    type: url-test

    include-all: true

    filter: '(?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|🇯🇵'
    exclude-filter: '0\.[0-5]|低倍率|省流|大流量|实验性'

    url: https://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    tolerance: 20
    lazy: true

  - name: 美国节点
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
    type: url-test

    include-all: true

    filter: '(?i)美国|美|US|United States|🇺🇸'
    exclude-filter: '0\.[0-5]|低倍率|省流|大流量|实验性'

    url: https://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    tolerance: 20
    lazy: true

# =========================================================
# Rule Providers
# =========================================================

rule-providers:

  brokers:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/hbin/dotfiles@master/mihomo/ruleset/brokers.yaml
    path: ./ruleset/brokers.yaml
    interval: 86400

  steam:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Steam/Steam.yaml
    path: ./ruleset/steam.yaml
    interval: 604800

  steamcn:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/SteamCN/SteamCN.yaml
    path: ./ruleset/steamcn.yaml
    interval: 604800

  wechat:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/WeChat/WeChat.yaml
    path: ./ruleset/wechat.yaml
    interval: 604800

  ai:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/global.yaml
    path: ./ruleset/ai.yaml
    interval: 86400

# =========================================================
# Rules
# =========================================================

rules:

  # -------------------------------------------------------
  # LAN
  # -------------------------------------------------------

  - GEOIP,lan,DIRECT,no-resolve
  - GEOSITE,private,DIRECT

  # -------------------------------------------------------
  # NTP
  # -------------------------------------------------------

  - GEOSITE,category-ntp,选择代理

  # -------------------------------------------------------
  # Custom Rule Providers
  # -------------------------------------------------------

  - RULE-SET,brokers,大富翁游戏
  - RULE-SET,wechat,DIRECT
  - RULE-SET,steam,Game
  - RULE-SET,steamcn,DIRECT
  - RULE-SET,ai,AI

  # -------------------------------------------------------
  # 基础国内服务
  # -------------------------------------------------------

  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,cn,DIRECT

  # -------------------------------------------------------
  # 指定服务
  # -------------------------------------------------------

  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,github,Developer
  - GEOSITE,google,Google
  - GEOSITE,category-social-media-!cn,Social Media
  - GEOSITE,microsoft,Microsoft
  - GEOSITE,netflix,Netflix
  - GEOSITE,spotify,Spotify
  - GEOSITE,telegram,Telegram
  - GEOSITE,tiktok@!cn,TikTok
  - GEOSITE,category-games-!cn,Game

  # -------------------------------------------------------
  # IP 加速规则
  # -------------------------------------------------------

  - GEOIP,netflix,Netflix,no-resolve
  - GEOIP,telegram,Telegram,no-resolve

  # 国内 IP 直连
  - GEOIP,cn,DIRECT,no-resolve

  # -------------------------------------------------------
  # GFW
  # -------------------------------------------------------

  - GEOSITE,gfw,选择代理
  - GEOSITE,geolocation-!cn,选择代理

  # -------------------------------------------------------
  # MATCH
  # -------------------------------------------------------

  - MATCH,选择代理
