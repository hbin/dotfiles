# Ghostty terminal configuration
# Reference: https://ghostty.org/docs/config

# Font
font-family = Monaco
font-size = 18

# Theme (built-in)
theme = "Apple Classic"

# Window
# Start maximized on the screen the window opens on (menu bar/dock stay
# visible; native fullscreen is still Cmd+Ctrl+F). No window-width/height:
# while `maximize` is true they are never consulted.
maximize = true
window-padding-x = 8
window-padding-y = 4

# Cursor: solid block, no blink
cursor-style = block
cursor-style-blink = false
shell-integration-features = no-cursor

# Selection: auto-copy to the system clipboard on mouse select.
# `true` is the macOS default but only writes Ghostty's private selection
# pasteboard, which other apps cannot paste; `clipboard` also writes the
# system clipboard, so Cmd+V works anywhere.
copy-on-select = clipboard

# Keybindings
# Cmd+Enter sends a literal carriage return
keybind = command+enter=text:\x0d

# Splits: Cmd+Shift+2 split below, Cmd+Shift+3 split right (mirrors Emacs
# M-2/M-3 in doom.d/config.el).
keybind = super+shift+2=new_split:down
keybind = super+shift+3=new_split:right

# Ghostty's default Cmd+Shift+D split is dropped.
keybind = super+shift+d=unbind

# Emacs-style editing. `esc:X` sends ESC then X, which zsh's line editor and
# Emacs both read as Meta. (`text:` uses Zig escapes: `\x7f` = DEL, the same
# byte Backspace sends.)
#   Cmd+D = M-d  kill-word (delete forward one word)
#   Cmd+F = M-f  forward-word   (search moved to Cmd+G, below)
#   Cmd+B = M-b  backward-word
#   C-h   = C-h  delete-backward-char
keybind = super+d=esc:d
keybind = super+f=esc:f
keybind = super+b=esc:b
keybind = ctrl+h=text:\x7f

# Search. Cmd+G finds; Cmd+Shift+G searches the selection; Cmd+N / Cmd+P step to
# the previous / next hit. This displaces Ghostty's default Cmd+G /
# Cmd+Shift+G search navigation.
keybind = super+g=start_search
keybind = super+shift+g=search_selection
keybind = super+n=navigate_search:previous
keybind = super+p=navigate_search:next
# search_selection now lives on Cmd+Shift+G, so Cmd+E is freed.
keybind = super+e=unbind

# New Window moved off Cmd+N (now search-next); it stays in the File menu.
keybind = super+shift+n=new_window

# Ghostty's default Cmd+Shift+W is dropped; Cmd+W still closes the surface.
keybind = super+shift+w=unbind

# macOS: Option key acts as Alt/Meta instead of typing special characters
macos-option-as-alt = true

# Confirm before closing a window/tab when a program is still running
confirm-close-surface = true
